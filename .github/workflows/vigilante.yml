name: Ralbew Cloud Vigilante 24/7

on:
  schedule:
    - cron: '*/5 * * * *'  # Se ejecuta automáticamente cada 5 minutos
  workflow_dispatch:      # Permite probarlo manualmente cuando quieras con un botón en GitHub

jobs:
  vigilar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install firebase-admin

      - name: Ejecutar Vigilante de Recordatorios
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          PHONE_NUMBER_ID: ${{ secrets.PHONE_NUMBER_ID }}
          DESTINATARIO: ${{ secrets.DESTINATARIO }}
        run: python check_and_notify.py
